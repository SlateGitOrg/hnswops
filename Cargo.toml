[package]
name = "hnswops"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "HNSW approximate-nearest-neighbor index from scratch, with operational tooling: recall monitoring, versioned snapshots and zero-downtime re-embedding migration."
license = "MIT"
readme = "README.md"
keywords = ["hnsw", "ann", "vector-search", "nearest-neighbor"]
categories = ["algorithms", "data-structures"]

[lib]
name = "hnswops"
path = "src/lib.rs"

[[bin]]
name = "hnswops"
path = "src/main.rs"

[dependencies]
bytemuck = "1.23"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
proptest = "1.5"
tempfile = "3.13"

[profile.release]
debug = false
lto = "thin"
codegen-units = 4

[profile.test]
opt-level = 1

[profile.dev.package.proptest]
opt-level = 2
